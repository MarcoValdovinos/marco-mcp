#  Workflow automático para generar snapshot diario del substrato
#  Autor: Marco Antonio Rojas Valdovinos · Toluca, México · 2026
# ═══════════════════════════════════════════════════════════════════════

name: Snapshot diario

on:
  # Cada día a las 12:00 UTC (06:00 CDMX)
  schedule:
    - cron: '0 12 * * *'

  # Manual desde GitHub Actions UI
  workflow_dispatch:

  # En cada push a main (opcional, comentar si molesta)
  # push:
  #   branches: [main]

# Solo un job a la vez
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── 2. Setup Node ───────────────────────────────────────────
      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── 3. Instalar dependencias ────────────────────────────────
      - name: 📦 Instalar dependencias
        run: npm install --silent

      # ─── 4. Calcular hash del substrato ──────────────────────────
      - name: 🔐 Calcular hash
        id: hash
        run: |
          HASH=$(cat data/*.md data/*.json data/projects/*.md data/decisions/*.md 2>/dev/null | sha256sum | awk '{print $1}')
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          SHORT_DATE=$(date -u +'%Y-%m-%d')

          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "short_date=$SHORT_DATE" >> $GITHUB_OUTPUT

          echo "SHA-256: $HASH"
          echo "Fecha:   $DATE"

      # ─── 5. Generar snapshot ─────────────────────────────────────
      - name: 📸 Generar snapshot
        run: |
          mkdir -p snapshots
          cat > snapshots/latest.json <<EOF
          {
            "date": "${{ steps.hash.outputs.date }}",
            "sha256": "${{ steps.hash.outputs.hash }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "author": "Marco Antonio Rojas Valdovinos",
            "workflow": "snapshot.yml"
          }
          EOF

          echo "Snapshot generado:"
          cat snapshots/latest.json

      # ─── 6. Commit y push ────────────────────────────────────────
      - name: 💾 Commit snapshot
        run: |
          git config user.name "marco-mcp-bot"
          git config user.email "bot@marco.mcp"

          git add snapshots/latest.json

          if git diff --staged --quiet; then
            echo "Sin cambios en el snapshot"
          else
            git commit -m "🔐 snapshot: ${{ steps.hash.outputs.short_date }} · ${{ steps.hash.outputs.hash }}"
            git push
            echo "Snapshot commiteado"
          fi

      # ─── 7. Notificación (opcional) ──────────────────────────────
      - name: 📢 Notificar (si falla)
        if: failure()
        run: |
          echo "⚠️ Snapshot falló en ${{ steps.hash.outputs.date }}"
          # Aquí podría ir notificación a Telegram si se configura