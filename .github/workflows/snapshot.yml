name: Snapshot diario

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta todos los días a medianoche
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write # ¡ESTO ES LO QUE FALTABA! Permiso para hacer push

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Snapshot
        run: npm run snapshot

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Solo hace commit si realmente hubo cambios en el snapshot
          if ! git diff --staged --quiet; then
            git commit -m "chore: update snapshot [skip ci]"
            git push
          else
            echo "✅ No hay cambios en el snapshot. Omitiendo commit."
          fi
