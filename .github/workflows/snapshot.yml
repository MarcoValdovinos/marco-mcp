name: Snapshot diario

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Snapshot
        run: npm run snapshot

      - name: 💾 Commit snapshot
        run: |
          git config user.name "marco-mcp-bot"
          git config user.email "bot@marco.mcp"
          # Fuerza la subida de TODO lo que esté dentro de la carpeta snapshots/
          git add -f snapshots/
          if git diff --staged --quiet; then
            echo "Sin cambios en el snapshot"
          else
            git commit -m "🔐 snapshot: actualización automática [skip ci]"
            git push
            echo "Snapshot commiteado exitosamente"
          fi
