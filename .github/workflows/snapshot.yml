name: Snapshot diario

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Snapshot
        id: hash
        run: |
          npm run snapshot
          echo "short_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "hash=$(sha256sum snapshots/latest.json | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT

      - name: 💾 Commit snapshot
        run: |
          git config user.name "marco-mcp-bot"
          git config user.email "bot@marco.mcp"
          git add -f snapshots/latest.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el snapshot"
          else
            git commit -m "🔐 snapshot: ${{ steps.hash.outputs.short_date }} · ${{ steps.hash.outputs.hash }}"
            git push
            echo "Snapshot commiteado"
          fi
